<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC Awards Archive</title>
<meta name="description" content="부산 인디 커넥트 페스티벌 역대 수상작 아카이브">
<meta property="og:title" content="BIC Awards Archive">
<meta property="og:description" content="부산 인디 커넥트 페스티벌 역대 수상작 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080810;--surface:#10101c;--surface2:#18182a;--surface3:#20203a;
  --accent:#ff2d55;--accent2:#ffd000;--accent3:#00e5ff;
  --text:#f0f0f8;--text-muted:#6060a0;--border:#22223a;
  --grand:#ffd700;--rising:#00e5ff;--jury:#c084fc;
  --font-display:'Bebas Neue','Black Han Sans',sans-serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-mono:'Space Mono',monospace;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5;}
.bg-image{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none;}
.bg-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;}
header,.stats-bar,.view-toggle-bar,.year-nav,.division-filter,.sponsors-bar,main,footer{position:relative;z-index:2;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8000;transition:opacity .5s;}
.loading-screen.hidden{opacity:0;pointer-events:none;}
.loading-logo{font-family:var(--font-display);font-size:80px;color:var(--accent);letter-spacing:4px;line-height:1;margin-bottom:24px;}
.loading-logo span{color:var(--text);}
.loading-bar-wrap{width:200px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.loading-bar{height:100%;background:var(--accent);border-radius:2px;animation:loadBar 1.5s ease forwards;}
@keyframes loadBar{from{width:0}to{width:100%}}
.loading-text{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:14px;letter-spacing:3px;}
header{padding:56px 48px 36px;border-bottom:1px solid var(--border);overflow:hidden;}
header::before{content:'AWARDS';position:absolute;right:-10px;top:-20px;font-family:var(--font-display);font-size:240px;line-height:1;color:rgba(255,45,85,0.04);pointer-events:none;user-select:none;letter-spacing:-5px;}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.logo-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:4px;text-transform:uppercase;margin-bottom:8px;}
.logo-title{font-family:var(--font-display);font-size:80px;line-height:.9;color:var(--text);letter-spacing:3px;}
.logo-title em{color:var(--accent);font-style:normal;}
.logo-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:10px;letter-spacing:2px;}
.header-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.lang-btn{padding:8px 18px;background:none;border:none;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:all .2s;letter-spacing:1px;}
.lang-btn.active{background:var(--accent);color:#fff;}
.updated-at{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;}
.sponsors-bar{padding:12px 48px;border-bottom:1px solid var(--border);display:none;}
.sponsors-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.sponsors-label{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;flex-shrink:0;}
.sponsor-logo-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.sponsor-logo-item{height:40px;opacity:.8;transition:opacity .2s;filter:brightness(0) invert(1);object-fit:contain;}
.sponsor-logo-item:hover{opacity:1;}
.stats-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 48px;}
.stats-inner{max-width:1280px;margin:0 auto;display:flex;gap:40px;flex-wrap:wrap;align-items:center;}
.stat-item{display:flex;align-items:baseline;gap:8px;}
.stat-num{font-family:var(--font-display);font-size:34px;color:var(--accent2);line-height:1;}
.stat-label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;}
.view-toggle-bar{padding:20px 48px;border-bottom:1px solid var(--border);background:var(--surface);}
.view-toggle-inner{max-width:1280px;margin:0 auto;display:flex;}
.view-tab{padding:10px 28px;border:1px solid var(--border);background:none;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;letter-spacing:2px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.view-tab:first-child{border-radius:var(--radius) 0 0 var(--radius);}
.view-tab:last-child{border-radius:0 var(--radius) var(--radius) 0;border-left:none;}
.view-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.year-nav{padding:18px 48px;border-bottom:1px solid var(--border);}
.year-nav-inner{max-width:1280px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.year-label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:2px;margin-right:6px;text-transform:uppercase;}
.year-btn{padding:5px 12px;background:none;border:1px solid var(--border);border-radius:3px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:all .2s;}
.year-btn:hover{border-color:var(--accent);color:var(--accent);}
.year-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.year-btn.all.active{background:var(--accent3);border-color:var(--accent3);color:#000;}
.division-filter{padding:12px 48px;border-bottom:1px solid var(--border);background:var(--surface);}
.division-filter-inner{max-width:1280px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.div-label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-right:4px;}
.div-btn{padding:4px 14px;background:none;border:1px solid var(--border);border-radius:20px;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;cursor:pointer;transition:all .2s;letter-spacing:1px;}
.div-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.div-btn.active{background:var(--accent2);border-color:var(--accent2);color:#000;font-weight:700;}
.div-badge-general{display:inline-flex;align-items:center;padding:2px 8px;background:rgba(255,208,0,.12);border:1px solid rgba(255,208,0,.3);border-radius:20px;font-family:var(--font-mono);font-size:9px;color:var(--accent2);letter-spacing:1px;}
.div-badge-rookie{display:inline-flex;align-items:center;padding:2px 8px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);border-radius:20px;font-family:var(--font-mono);font-size:9px;color:var(--accent3);letter-spacing:1px;}
main{max-width:1280px;margin:0 auto;padding:40px 48px 80px;}
.year-section{margin-bottom:72px;animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.year-header{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.year-number{font-family:var(--font-display);font-size:88px;line-height:.9;color:var(--accent);letter-spacing:-2px;}
.year-meta{flex:1;}
.year-info{font-size:13px;color:var(--text-muted);line-height:1.7;}
.year-edition{font-family:var(--font-display);font-size:22px;color:var(--text-muted);letter-spacing:2px;}
.awards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.award-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;transition:all .25s;display:flex;flex-direction:column;}
.award-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 40px rgba(255,45,85,.18);}
.award-card.grand-prix{border-color:rgba(255,215,0,.6);background:linear-gradient(160deg,rgba(255,215,0,.08) 0%,var(--surface) 60%);}
.award-card.grand-prix:hover{border-color:var(--grand);box-shadow:0 12px 48px rgba(255,215,0,.35);}
.award-card.rising-star{border-color:rgba(0,229,255,.5);background:linear-gradient(160deg,rgba(0,229,255,.07) 0%,var(--surface) 60%);}
.award-card.rising-star:hover{border-color:var(--rising);box-shadow:0 12px 48px rgba(0,229,255,.3);}
.award-card.jury-prize{border-color:rgba(192,132,252,.5);background:linear-gradient(160deg,rgba(192,132,252,.07) 0%,var(--surface) 60%);}
.award-card.jury-prize:hover{border-color:var(--jury);box-shadow:0 12px 48px rgba(192,132,252,.3);}
.card-image{width:100%;height:160px;background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;}
.card-image img{width:100%;height:100%;object-fit:cover;display:block;}
.card-image-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:52px;color:rgba(255,255,255,.05);}
.steam-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:4px 8px;font-family:var(--font-mono);font-size:10px;color:#c7d5e0;text-decoration:none;letter-spacing:1px;transition:all .2s;z-index:5;display:flex;align-items:center;gap:4px;}
.steam-badge:hover{background:#1b2838;border-color:#66c0f4;color:#66c0f4;}
.card-strip{height:3px;width:100%;background:var(--border);flex-shrink:0;}
.award-card.grand-prix .card-strip{background:var(--grand);height:4px;}
.award-card.rising-star .card-strip{background:var(--rising);height:4px;}
.award-card.jury-prize .card-strip{background:var(--jury);height:4px;}
.award-card:not(.grand-prix):not(.rising-star):not(.jury-prize) .card-strip{background:var(--accent);opacity:.5;}
.card-body{padding:16px;display:flex;flex-direction:column;gap:5px;flex:1;}
.card-top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px;}
.award-category{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);}
.cat-emblem-badge{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.15);flex-shrink:0;background:var(--surface2);}
.cat-emblem-emoji{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--surface2);border:1px solid rgba(255,255,255,.12);flex-shrink:0;}
.cat-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6;flex-shrink:0;}
.award-card.grand-prix .cat-dot{background:var(--grand);opacity:1;}
.award-card.grand-prix .award-category{color:rgba(255,215,0,.9);}
.award-card.rising-star .cat-dot{background:var(--rising);opacity:1;}
.award-card.rising-star .award-category{color:rgba(0,229,255,.9);}
.award-card.jury-prize .cat-dot{background:var(--jury);opacity:1;}
.award-card.jury-prize .award-category{color:rgba(192,132,252,.9);}
.award-game{font-weight:700;font-size:14px;line-height:1.35;color:var(--text);}
.award-card.grand-prix .award-game{color:var(--grand);font-size:16px;font-weight:800;}
.award-card.rising-star .award-game{color:var(--rising);font-size:15px;font-weight:800;}
.award-card.jury-prize .award-game{color:var(--jury);font-size:15px;font-weight:800;}
.award-studio{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.country-badge{padding:1px 7px;background:var(--surface3);border:1px solid var(--border);border-radius:2px;font-size:10px;letter-spacing:1px;}
.award-desc{font-size:12px;color:var(--text-muted);line-height:1.55;padding-top:8px;border-top:1px solid var(--border);margin-top:auto;}
.steam-link-text,.market-link-text{display:inline-flex;align-items:center;gap:4px;margin-top:6px;margin-right:8px;font-family:var(--font-mono);font-size:10px;color:#66c0f4;text-decoration:none;letter-spacing:1px;transition:opacity .2s;}
.steam-link-text:hover,.market-link-text:hover{opacity:.7;}
.market-links-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;animation:fadeUp .35s ease both;}
.cat-section-header{font-family:var(--font-display);font-size:28px;letter-spacing:3px;color:var(--text-muted);margin:32px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.cat-section-header:first-child{margin-top:0;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;transition:all .3s;text-align:center;position:relative;overflow:hidden;}
.cat-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--cat-color,rgba(255,45,85,.15)) 0%,transparent 70%);opacity:0;transition:opacity .3s;}
.cat-card:hover{border-color:var(--cat-color,var(--accent));transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.3);}
.cat-card:hover::before{opacity:1;}
.cat-emblem{width:80px;height:80px;border-radius:50%;border:2px solid var(--cat-color,var(--accent));display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;z-index:1;background:var(--surface2);box-shadow:0 0 20px var(--cat-color,rgba(255,45,85,.3));transition:all .3s;overflow:hidden;flex-shrink:0;}
.cat-emblem img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.cat-card:hover .cat-emblem{box-shadow:0 0 32px var(--cat-color,rgba(255,45,85,.5));transform:scale(1.05);}
.cat-name{font-family:var(--font-display);font-size:18px;letter-spacing:2px;color:var(--text);line-height:1.2;position:relative;z-index:1;}
.cat-name-en{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:2px;position:relative;z-index:1;}
.cat-count{font-family:var(--font-mono);font-size:10px;color:var(--cat-color,var(--accent));letter-spacing:1px;position:relative;z-index:1;}
.cat-detail-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border);animation:fadeUp .3s ease both;flex-wrap:wrap;}
.cat-back-btn{padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);font-family:var(--font-mono);font-size:11px;cursor:pointer;transition:all .2s;letter-spacing:1px;}
.cat-back-btn:hover{border-color:var(--accent3);color:var(--accent3);}
.cat-detail-emblem{width:64px;height:64px;border-radius:50%;border:2px solid var(--cat-color,var(--accent));display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--surface2);overflow:hidden;flex-shrink:0;}
.cat-detail-emblem img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.cat-detail-title{font-family:var(--font-display);font-size:44px;line-height:.9;color:var(--text);}
.cat-detail-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:1px;}
.cat-detail-desc{font-size:13px;color:var(--text-muted);line-height:1.6;margin-top:6px;max-width:600px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;letter-spacing:1px;border:1px dashed var(--border);border-radius:var(--radius);grid-column:1/-1;}
footer{border-top:1px solid var(--border);padding:20px 48px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:2px;}
footer a{color:var(--accent);text-decoration:none;}

/* SEARCH BAR */
.search-bar{padding:16px 48px;border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:2;}
.search-bar-inner{max-width:1280px;margin:0 auto;position:relative;}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:14px;padding:12px 44px 12px 44px;outline:none;transition:all .2s;letter-spacing:.3px;}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,45,85,.12);}
.search-input::placeholder{color:var(--text-muted);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-muted);pointer-events:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--surface3);border:none;color:var(--text-muted);cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;transition:all .2s;}
.search-clear:hover{background:var(--accent);color:#fff;}
.search-clear.visible{display:flex;}
.search-result-info{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-top:8px;height:14px;transition:opacity .2s;}

/* FLOATING WIDGET */
.float-widget{position:fixed;bottom:32px;right:28px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:500;}
.float-year-list{display:flex;flex-direction:column;gap:6px;align-items:flex-end;
  max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;opacity:0;}
.float-widget.open .float-year-list{max-height:600px;opacity:1;}
.float-btn-row{display:flex;gap:8px;align-items:center;}
.float-home-btn,.float-toggle-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:all .25s;
  border:1px solid var(--border);backdrop-filter:blur(8px);
  background:rgba(16,16,28,.85);color:var(--text-muted);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.float-home-btn:hover{border-color:var(--accent3);color:var(--accent3);transform:scale(1.08);}
.float-toggle-btn{background:var(--accent);border-color:var(--accent);color:#fff;}
.float-toggle-btn:hover{background:#ff4d6d;transform:scale(1.08);}
.float-year-btn{
  padding:5px 14px;border-radius:20px;
  background:rgba(16,16,28,.9);border:1px solid var(--border);
  color:var(--text-muted);font-family:var(--font-mono);font-size:11px;
  cursor:pointer;transition:all .2s;letter-spacing:1px;
  backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.3);
  white-space:nowrap;
}
.float-year-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateX(-4px);}
.float-year-btn.current{border-color:var(--accent);color:var(--accent);background:rgba(255,45,85,.12);}
@media(max-width:640px){.float-widget{bottom:20px;right:16px;}}
@media(max-width:640px){
  header,.stats-bar,.view-toggle-bar,.year-nav,.division-filter,.sponsors-bar,main,footer{padding-left:20px;padding-right:20px;}
  .logo-title{font-size:52px;}.year-number{font-size:60px;}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}
</style>
</head>
<body>
<div class="bg-image" id="bgImage"></div>
<div class="bg-overlay" id="bgOverlay"></div>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">BIC <span>AWARDS</span></div>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  <div class="loading-text">LOADING ARCHIVE...</div>
</div>
<header>
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-eyebrow" id="hdrEyebrow">부산 인디 커넥트 페스티벌</div>
      <div class="logo-title">BIC <em>AWARDS</em></div>

  {id:'audience',nameKo:'관객심사',nameEn:'Audience Choice',emoji:'👏',color:'#facc15',descKo:'관객이 직접 선정한 수상작 (2015년 한정)',descEn:'Award chosen by the audience (2015 only)',legacy:true},

let lang='ko',currentView='year',filterYear='all',filterDiv='all',selectedCatId=null;
let awardsData=[],siteConfig={};

async function loadAll(){
  try{
    const[dataRes,cfgRes]=await Promise.all([
      fetch('data.json?t='+Date.now()),
      fetch('config.json?t='+Date.now())
    ]);
    const dataJson=dataRes.ok?await dataRes.json():{awards:[]};
    awardsData=dataJson.awards||[];
    if(dataJson.updatedAt){
      const d=new Date(dataJson.updatedAt);
      document.getElementById('updatedAt').textContent='Updated '+d.toLocaleDateString('ko-KR');
    }
    if(cfgRes.ok){siteConfig=await cfgRes.json();applyConfig();}
  }catch(e){awardsData=[];}
  setTimeout(()=>document.getElementById('loadingScreen').classList.add('hidden'),800);
  renderStats();renderYearNav();renderMain();
}

function applyConfig(){
  const s=siteConfig.site||{};
  const r=document.documentElement.style;
  if(s.primaryColor){r.setProperty('--accent',s.primaryColor);}
  if(s.accentColor) r.setProperty('--accent2',s.accentColor);
  if(s.subColor)    r.setProperty('--accent3',s.subColor);
  if(s.bgColor)     {r.setProperty('--bg',s.bgColor);document.body.style.background=s.bgColor;}
  if(s.displayFont) r.setProperty('--font-display',s.displayFont);
  if(s.bodyFont)    {r.setProperty('--font-body',s.bodyFont);document.body.style.fontFamily=s.bodyFont;}
  if(s.eyebrow)  document.getElementById('hdrEyebrow').textContent=s.eyebrow;
  if(s.subtitle) document.getElementById('hdrSubtitle').textContent=s.subtitle;
  if(s.bgImage){
    document.getElementById('bgImage').style.backgroundImage=`url('${s.bgImage}')`;
    document.getElementById('bgOverlay').style.background=`rgba(0,0,0,${s.bgOverlay??0.6})`;
  }
  // 엠블럼 — config.json 우선, 없으면 GitHub 파일명 자동 매핑
  const BASE = 'https://leecharcoal.github.io/bic-awards/';
  const EMBLEM_MAP = {
    'grand-prix':   { general: 'grand-prix.png',    rookie: 'grand-prix-rookie.png' },
    'jury-general': { general: 'jury-general.png',  rookie: 'jury-general.png' },
    'rising-star':  { general: 'rising-star.png',   rookie: 'rising-star.png' },
    'jury-rookie':  { general: 'jury-rookie.png',   rookie: 'jury-rookie.png' },
    'art':          { general: 'art.png',            rookie: 'art-rookie.png' },
    'design':       { general: 'design.png',         rookie: 'design-rookie.png' },
    'experimental': { general: 'experimental.png',  rookie: 'experimental-rookie.png' },
    'narrative':    { general: 'narrative.png',      rookie: 'narrative-rookie.png' },
    'casual':       { general: 'casual.png',         rookie: 'casual-rookie.png' },
    'esports':      { general: 'esports.png',        rookie: 'esports-rookie.png' },
    'audio':        { general: 'audio.png',          rookie: 'audio-rookie.png' },
    'social':       { general: 'social.png',         rookie: 'social-rookie.png' },
    'action':       { general: 'action.png',         rookie: 'action-rookie.png' },
    'booth':        { general: '', rookie: '' },
    'audience':     { general: '', rookie: '' },
  };
  categories.forEach(cat=>{
    const cfgEmb  = siteConfig.categories?.[cat.id]?.emblem;
    const cfgEmbR = siteConfig.categories?.[cat.id]?.emblemRookie;
    const mapFile = EMBLEM_MAP[cat.id];
    cat.emblemImg        = cfgEmb  || (mapFile ? BASE + mapFile.general : '');
    cat.emblemImgRookie  = cfgEmbR || (mapFile ? BASE + mapFile.rookie  : '');
  });
  // 스폰서 라벨
  const sponsorsLabel = document.getElementById('sponsorsLabel');
  if(sponsorsLabel && s.sponsorsLabel) sponsorsLabel.textContent = s.sponsorsLabel;

  const sponsors=(siteConfig.sponsors||[]).filter(sp=>sp.logo&&sp.name);
  if(sponsors.length){
    document.getElementById('sponsorsBar').style.display='block';
    document.getElementById('sponsorLogoWrap').innerHTML=sponsors.map(sp=>
      sp.url
        ?`<a href="${sp.url}" target="_blank" rel="noopener"><img class="sponsor-logo-item" src="${sp.logo}" alt="${sp.name}" title="${sp.name}"></a>`
        :`<img class="sponsor-logo-item" src="${sp.logo}" alt="${sp.name}" title="${sp.name}">`
    ).join('');
  }
}

function setLang(l){
  lang=l;
  document.getElementById('btnKo').classList.toggle('active',l==='ko');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.querySelectorAll('[data-ko]').forEach(el=>el.textContent=l==='ko'?el.dataset.ko:el.dataset.en);
  renderStats();renderYearNav();renderMain();
}
function renderStats(){
  const years=[...new Set(awardsData.map(a=>a.year))];
  const defaultStats=[
    {val:years.length,labelKo:'개최 연도',labelEn:'Years'},
    {val:awardsData.length,labelKo:'총 수상',labelEn:'Total Awards'},
    {val:Math.max(...awardsData.map(a=>a.year),0),labelKo:'최근 개최',labelEn:'Latest'},
    {val:'BIC',labelKo:'부산 인디 커넥트',labelEn:'Busan Indie Connect'},
  ];
  const cfgStats = siteConfig?.site?.stats;
  const stats = (cfgStats && cfgStats.length) ? cfgStats : defaultStats;
  document.getElementById('statsBar').innerHTML=stats.map(s=>`
    <div class="stat-item">
      <div class="stat-num">${s.val}</div>
      <div class="stat-label">${lang==='ko'?s.labelKo:s.labelEn}</div>
    </div>`).join('');
}
function renderYearNav(){
  const years=[...new Set(awardsData.map(a=>a.year))].sort((a,b)=>b-a);
  const nav=document.getElementById('yearNav');
  nav.innerHTML=`<span class="year-label">${lang==='ko'?'연도':'YEAR'}</span>`;
  const allBtn=document.createElement('button');
  allBtn.className='year-btn all'+(filterYear==='all'?' active':'');
  allBtn.textContent=lang==='ko'?'전체':'ALL';
  allBtn.onclick=()=>{filterYear='all';renderYearNav();renderMain();};
  nav.appendChild(allBtn);
  years.forEach(yr=>{
    const btn=document.createElement('button');
    btn.className='year-btn'+(filterYear===yr?' active':'');
    btn.textContent=yr;
    btn.onclick=()=>{filterYear=yr;renderYearNav();renderMain();};
    nav.appendChild(btn);
  });
}
function setView(v){
  currentView=v;selectedCatId=null;
  document.getElementById('tabYear').classList.toggle('active',v==='year');
  document.getElementById('tabCat').classList.toggle('active',v==='category'||v==='cat-detail');
  document.getElementById('yearNavBar').style.display=v==='year'?'':'none';
  document.getElementById('divisionBar').style.display=v==='year'?'':'none';
  renderMain();
}
function setDiv(d){
  filterDiv=d;
  ['all','general','rookie'].forEach(x=>document.getElementById('div'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===d));
  renderMain();
}
function renderMain(){
  if(currentView==='year') renderYearView();
  else if(currentView==='category') renderCategoryView();
  else if(currentView==='cat-detail') renderCatDetailView();
}
function renderYearView(){
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  const years=[...new Set(awardsData.map(a=>a.year))].sort((a,b)=>b-a);
  const filteredYears=filterYear==='all'?years:years.filter(y=>y===filterYear);
  if(!filteredYears.length){main.innerHTML=`<div class="empty-state">${lang==='ko'?'데이터가 없습니다':'No data available'}</div>`;return;}
  filteredYears.forEach(yr=>{
    let awards=awardsData.filter(a=>a.year===yr);
    if(filterDiv==='general') awards=awards.filter(a=>a.division==='general');
    else if(filterDiv==='rookie') awards=awards.filter(a=>a.division==='rookie');
    if(searchQuery) awards=awards.filter(a=>matchSearch(a));
    if(searchQuery && !awards.length) return; // 검색 결과 없으면 연도 섹션 숨김
    const sec=document.createElement('div');
    sec.className='year-section';
    sec.innerHTML=`
      <div class="year-header">
        <div class="year-number">${yr}</div>
        <div class="year-meta"><div class="year-info">${lang==='ko'?`${yr}년 BIC 어워드`:`BIC Awards ${yr}`}</div></div>
        <div class="year-edition">${yr}</div>
      </div>
      <div class="awards-grid" id="grid-${yr}"></div>`;
    main.appendChild(sec);
    const grid=document.getElementById(`grid-${yr}`);
    if(!awards.length){grid.innerHTML=`<div class="empty-state">${lang==='ko'?'해당 부문 수상작 없음':'No awards for this filter'}</div>`;}
    else awards.forEach(a=>grid.appendChild(buildCard(a)));
  });
}

function buildMarketLinks(steam, market) {
  const links = [];
  if(steam) links.push(steam.trim());
  if(market) market.split(',').forEach(u => { const t=u.trim(); if(t) links.push(t); });
  return links.map(url => {
    const m = detectMarket(url);
    if(!m) return '';
    return `<a class="market-link-text" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:${m.color}">${m.icon} ${m.label}</a>`;
  }).join('');
}
function buildCard(a){
  const div=document.createElement('div');
  div.className='award-card'+(a.type?' '+a.type:'');
  const cat=categories.find(c=>c.id===a.catId);
  const catName=cat?(lang==='ko'?cat.nameKo:cat.nameEn):(lang==='ko'?'수상':'Award');
  // 일반/루키 엠블럼 구분 적용
  if(cat && a.division==='rookie' && cat.emblemImgRookie) cat._activeEmblem=cat.emblemImgRookie;
  else if(cat && cat.emblemImg) cat._activeEmblem=cat.emblemImg;
  else if(cat) cat._activeEmblem='';
  let divBadge='';
  if(a.division==='general') divBadge=`<span class="div-badge-general">${lang==='ko'?'일반':'GENERAL'}</span>`;
  else if(a.division==='rookie') divBadge=`<span class="div-badge-rookie">${lang==='ko'?'루키':'ROOKIE'}</span>`;
  const imgContent=a.img
    ?`<img src="${a.img}" alt="${a.gameKo}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-image-placeholder\\'>${(lang==='ko'?a.gameKo:a.gameEn).slice(0,2).toUpperCase()}</div>'">`
    :`<div class="card-image-placeholder">${(lang==='ko'?a.gameKo:a.gameEn).slice(0,2).toUpperCase()}</div>`;
  // 엠블럼 배지 — 일반/루키 구분
  const emblemSrc = (a.division==='rookie' && cat?.emblemImgRookie) ? cat.emblemImgRookie
                  : cat?.emblemImg ? cat.emblemImg : '';
  const catEmoji = cat?.emoji || '';
  const emblemBadge = emblemSrc
    ? `<img class="cat-emblem-badge" src="${emblemSrc}" alt="${catName}">`
    : `<span class="cat-emblem-emoji">${catEmoji}</span>`;

  div.innerHTML=`
    <div class="card-image">${imgContent}
      ${(()=>{
        const firstUrl = a.steam || (a.market ? a.market.split(',')[0].trim() : '');
        if(!firstUrl) return '';
        const m = detectMarket(firstUrl);
        return `<a class="steam-badge" href="${firstUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:${m.color}">${m.icon} ${m.label}</a>`;
      })()}
    </div>
    <div class="card-strip"></div>
    <div class="card-body">
      <div class="card-top-row">
        <div class="award-category">${emblemBadge}<span>${catName}</span></div>
        ${divBadge}
      </div>
      <div class="award-game">${lang==='ko'?a.gameKo:a.gameEn}</div>
      <div class="award-studio">${a.studio||a.studioEn||''}${a.country?`<span class="country-badge">${a.country}</span>`:''}</div>
      ${(lang==='ko'?a.descKo:a.descEn)?`<div class="award-desc">${lang==='ko'?a.descKo:a.descEn}</div>`:''}
      ${buildMarketLinks(a.steam, a.market)}
    </div>`;
  return div;
}
function renderCategoryView(){
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  const groups=[
    {label:{ko:'최고상',en:'TOP AWARDS'},ids:['grand-prix','jury-general','rising-star','jury-rookie']},
    {label:{ko:'공통 어워드 부문',en:'AWARD CATEGORIES'},ids:['art','design','experimental','narrative','casual','esports','audio','social','action']},
    {label:{ko:'과거 수상 부문',en:'PAST CATEGORIES'},ids:['booth','audience']},
  ];
  groups.forEach(g=>{
    const hdr=document.createElement('div');
    hdr.className='cat-section-header';
    hdr.textContent=lang==='ko'?g.label.ko:g.label.en;
    main.appendChild(hdr);
    const grid=document.createElement('div');
    grid.className='cat-grid';
    g.ids.forEach(id=>{
      const cat=categories.find(c=>c.id===id);
      if(!cat) return;
      const count=awardsData.filter(a=>a.catId===id).length;
      const card=document.createElement('div');
      card.className='cat-card';
      card.style.setProperty('--cat-color',cat.color);
      const emblemInner=cat.emblemImg?`<img src="${cat.emblemImg}" alt="${cat.nameKo}">`:`${cat.emoji}`;
      card.innerHTML=`
        <div class="cat-emblem">${emblemInner}</div>
        <div><div class="cat-name">${lang==='ko'?cat.nameKo:cat.nameEn}</div><div class="cat-name-en">${cat.nameEn}</div></div>
        <div class="cat-count">${count} ${lang==='ko'?'수상작':'winners'}</div>`;
      card.onclick=()=>{selectedCatId=id;currentView='cat-detail';renderMain();};
      grid.appendChild(card);
    });
    main.appendChild(grid);
  });
}
function renderCatDetailView(){
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  const cat=categories.find(c=>c.id===selectedCatId);
  if(!cat){setView('category');return;}
  const allAwards=awardsData.filter(a=>a.catId===selectedCatId&&matchSearch(a)).sort((a,b)=>b.year-a.year);
  const emblemInner=cat.emblemImg?`<img src="${cat.emblemImg}" alt="${cat.nameKo}">`:`${cat.emoji}`;
  const hdr=document.createElement('div');
  hdr.className='cat-detail-header';
  hdr.innerHTML=`
    <button class="cat-back-btn" onclick="setView('category')">← ${lang==='ko'?'부문 목록':'All Categories'}</button>
    <div class="cat-detail-emblem" style="--cat-color:${cat.color}">${emblemInner}</div>
    <div>
      <div class="cat-detail-title">${lang==='ko'?cat.nameKo:cat.nameEn}</div>
      <div class="cat-detail-sub">${allAwards.length} ${lang==='ko'?'개 역대 수상작':'all-time winners'}</div>
      <div class="cat-detail-desc">${lang==='ko'?cat.descKo:cat.descEn}</div>
    </div>`;
  main.appendChild(hdr);
  if(!allAwards.length){main.innerHTML+=`<div class="empty-state">${lang==='ko'?'아직 수상작 없음':'No winners recorded yet'}</div>`;return;}
  const byYear={};
  allAwards.forEach(a=>{if(!byYear[a.year])byYear[a.year]=[];byYear[a.year].push(a);});
  Object.keys(byYear).sort((a,b)=>b-a).forEach(yr=>{
    const sec=document.createElement('div');
    sec.className='year-section';
    sec.innerHTML=`<div class="year-header" style="margin-bottom:16px"><div class="year-number" style="font-size:56px">${yr}</div></div><div class="awards-grid" id="cg-${yr}"></div>`;
    main.appendChild(sec);
    byYear[yr].forEach(a=>document.getElementById(`cg-${yr}`).appendChild(buildCard(a)));
  });
}
// ══════════ SEARCH ══════════
let searchQuery = '';

function handleSearch(val) {
  searchQuery = val.trim().toLowerCase();
  document.getElementById('searchClear').classList.toggle('visible', searchQuery.length > 0);
  renderMain();
  updateSearchInfo();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('searchResultInfo').textContent = '';
  renderMain();
}

function updateSearchInfo() {
  const info = document.getElementById('searchResultInfo');
  if(!searchQuery) { info.textContent = ''; return; }
  const matched = awardsData.filter(a => matchSearch(a)).length;
  info.textContent = lang==='ko'
    ? `"${searchQuery}" 검색 결과 ${matched}개`
    : `${matched} result(s) for "${searchQuery}"`;
}

function matchSearch(a) {
  if(!searchQuery) return true;
  const q = searchQuery;
  const fields = [
    a.gameKo, a.gameEn, a.studio, a.studioEn,
    a.country, a.catKo,
    categories.find(c=>c.id===a.catId)?.nameKo || '',
    categories.find(c=>c.id===a.catId)?.nameEn || '',
  ];
  return fields.some(f => f && f.toLowerCase().includes(q));
}

// ══════════ FLOATING WIDGET ══════════
let floatOpen = false;

function toggleFloatWidget() {
  floatOpen = !floatOpen;
  document.getElementById('floatWidget').classList.toggle('open', floatOpen);
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  floatOpen = false;
  document.getElementById('floatWidget').classList.remove('open');
}

function scrollToYear(yr) {
  const el = document.getElementById(`year-anchor-${yr}`);
  if(el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  floatOpen = false;
  document.getElementById('floatWidget').classList.remove('open');
}

function buildFloatWidget() {
  const widget = document.getElementById('floatWidget');
  if(!widget) return;
  if(currentView !== 'year') { widget.style.display = 'none'; return; }
  widget.style.display = 'flex';
  const years = [...new Set(awardsData.map(a=>a.year))].sort((a,b)=>b-a);
  document.getElementById('floatYearList').innerHTML = years.map(yr =>
    `<button class="float-year-btn" onclick="scrollToYear(${yr})">${yr}</button>`
  ).join('');
}

// renderYearView 후에 anchor + widget 빌드
const _baseRenderYearView = renderYearView;
renderYearView = function() {
  _baseRenderYearView();
  const years = [...new Set(awardsData.map(a=>a.year))].sort((a,b)=>b-a);
  years.forEach(yr => {
    const grid = document.getElementById(`grid-${yr}`);
    if(grid && grid.parentElement && !grid.parentElement.id) {
      grid.parentElement.id = `year-anchor-${yr}`;
    }
  });
  buildFloatWidget();
};

// 뷰 변경 시 위젯 표시/숨김
const _baseSetView = setView;
setView = function(v) {
  _baseSetView(v);
  buildFloatWidget();
};

loadAll();
</script>
